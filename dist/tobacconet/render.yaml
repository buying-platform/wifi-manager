services:
  # ── FastAPI Backend ──────────────────────────────────────────────
  - type: web
    name: tobacconet-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: tobacconet-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://tobacconet.onrender.com
    healthCheckPath: /

  # ── Static Frontend ──────────────────────────────────────────────
  - type: web
    name: tobacconet
    runtime: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ── PostgreSQL Database ──────────────────────────────────────────
databases:
  - name: tobacconet-db
    plan: free
    databaseName: tobacconet
    user: tobacconet
